<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  #icon {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-weight: 700;
    line-height: 1;
  }
</style>
</head>
<body>
<div id="icon">评</div>
<script>
  // size 由 scripts/generate-icons.mjs 通过 query 传入：128 / 48 / 16
  const size = Number(new URLSearchParams(location.search).get("size")) || 128;
  const el = document.getElementById("icon");
  el.style.width = size + "px";
  el.style.height = size + "px";
  el.style.borderRadius = Math.round(size * 0.22) + "px";
  // 16px 下「评」需要相对更大的字号才辨认得出
  el.style.fontSize = Math.round(size * (size <= 16 ? 0.75 : 0.62)) + "px";
</script>
</body>
</html>
